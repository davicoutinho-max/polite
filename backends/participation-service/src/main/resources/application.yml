spring:
  application:
    name: participation-service

  # Loads participation-service/.env (KEY=VALUE, gitignored — see .env.example) as extra
  # properties, so the Resend key below can be edited in a local file instead of exported as a
  # shell env var every time this service is launched with `java -jar`. Safe if the file doesn't
  # exist.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/participation_service
    username: ${DB_USERNAME:participation_service_app}
    password: ${DB_PASSWORD:participation_dev_pw}
    hikari:
      pool-name: participation-service-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init schema (pre-applied by docker infra)"
    validate-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

participation:
  email:
    # Real key lives in participation-service/.env (gitignored), never here — see EmailProperties.
    api-key: ${RESEND_API_KEY:}
    from-address: ${RESEND_FROM_ADDRESS:CivicPulse <onboarding@resend.dev>}

server:
  port: ${SERVER_PORT:8092}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    dev.civicpulse.participation: INFO
    org.flywaydb: INFO
