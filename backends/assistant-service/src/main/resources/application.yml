spring:
  application:
    name: assistant-service

  # Loads assistant-service/.env (KEY=VALUE, gitignored — see .env.example) as extra properties,
  # so GEMINI_API_KEY below can be edited in a local file instead of exported as a shell env var
  # every time this service is launched with `java -jar`. Safe if the file doesn't exist.
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/assistant_service
    username: ${DB_USERNAME:assistant_service_app}
    password: ${DB_PASSWORD:assistant_dev_pw}
    hikari:
      pool-name: assistant-service-pool
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "init schema (pre-applied by docker infra)"
    validate-on-migrate: true

assistant:
  gemini:
    # Real key lives in assistant-service/.env (gitignored), never here — see GeminiProperties.
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

server:
  port: ${SERVER_PORT:8099}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    dev.civicpulse.assistant: INFO
    org.flywaydb: INFO
