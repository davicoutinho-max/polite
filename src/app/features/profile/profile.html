@if (loading()) {
  <div class="profile">
    <div class="profile-skeleton__cover">
      <ui-skeleton width="100%" height="256px" />
      <ui-skeleton class="profile-skeleton__avatar" shape="circle" [width]="128" />
    </div>
    <div class="profile-skeleton__info">
      <ui-skeleton width="220px" height="24px" />
      <ui-skeleton width="280px" height="16px" />
      <div class="profile-skeleton__actions">
        <ui-skeleton shape="rect" width="120px" height="40px" />
        <ui-skeleton shape="rect" width="120px" height="40px" />
      </div>
    </div>
    <div class="profile-skeleton__tabs">
      @for (i of [1, 2, 3, 4, 5]; track i) {
        <ui-skeleton shape="rect" width="110px" height="36px" />
      }
    </div>
    <div class="profile-skeleton__body">
      <ui-skeleton shape="rect" width="100%" height="90px" />
      <ui-skeleton shape="rect" width="100%" height="90px" />
      <ui-skeleton shape="rect" width="100%" height="90px" />
    </div>
  </div>
} @else {
<div class="profile">
  <app-profile-header
    [politician]="politician()"
    [following]="isFollowing()"
    [canFollow]="canFollow()"
    [canContact]="canContact()"
    [canAffiliate]="canAffiliate()"
    [isOwnProfile]="isOwnProfile()"
    (toggleFollow)="onToggleFollow()"
    (contact)="onContact()"
  />

  <div class="profile__tabs">
    <app-profile-tabs [tabs]="tabs()" [activeId]="activeTab()" (tabChange)="onTabChange($event)" />
  </div>

  <section class="profile__content">
    @switch (activeTab()) {
      @case ('activity') {
        <div class="profile__activity">
          @for (post of activityPosts(); track post.id) {
            <app-post-card
              [post]="post"
              [currentUserAvatar]="currentUserAvatar()"
              [canReact]="canReact()"
              (like)="onLike($event)"
              (addComment)="onComment($event)"
              (vote)="onVote($event)"
              (unvote)="onUnvote($event)"
              (delete)="onDelete($event)"
            />
          } @empty {
            <ui-empty
              icon="forum"
              [title]="'empty.profile-activity.title' | translate: 'No publications yet'"
              [description]="'empty.profile-activity.desc' | translate: 'Posts from this politician will appear here.'"
            />
          }
        </div>
      }
      @case ('overview') {
        <app-profile-overview [politician]="politician()" />
      }
      @case ('parliamentary') {
        <app-profile-parliamentary [activity]="activity()" />
      }
      @case ('transparency') {
        <app-profile-transparency [report]="transparency()" [politicianId]="politician().id" [isOwnProfile]="isOwnProfile()" />
      }
      @case ('timeline') {
        <app-profile-career [milestones]="career()" />
      }
    }
  </section>
</div>
}
